                                <p class="text-sm text-slate-600 mb-3"><strong>La Tesis Clásica vs. El Revisionismo:</strong> La sociología tradicional (ej. Gino Germani) decía que el peronismo triunfó porque manipuló a una "masa disponible" (migrantes del interior, ignorantes de la política sindical, con mentalidad pasiva y tradicional). M&P destrozan este argumento.</p>

                                    <li><strong>El apoyo como acto RACIONAL:</strong> La alianza de los trabajadores con Perón fue absolutamente racional y táctica. Perón fue el primer funcionario del Estado que institucionalizó sus reclamos históricos (aguinaldo, vacaciones, convenios colectivos, tribunales de trabajo) y reconoció a los sindicatos como actores legítimos del poder. No fueron engañados, cobraron un precio altísimo y real por su apoyo.</li>

                                <p class="text-sm text-slate-300 mb-3">El 24 de marzo de 1976, las Fuerzas Armadas toman el poder instalando el "Proceso de Reorganización Nacional". Aplican la doctrina de la Seguridad Nacional y el Terrorismo de Estado sistemático.</p>

                            <p class="text-slate-600 text-sm">Tras la hiperinflación de 1989, asume Carlos Menem. Amparado en la crisis, ejecuta el plan neoliberal que la dictadura no pudo completar: privatización de casi todas las empresas del Estado (YPF, Aerolíneas, ferrocarriles, servicios), desregulación laboral y el Plan de Convertibilidad (1 dólar = 1 peso). El resultado macroeconómico fue engañoso (baja inflación inicial, "ilusión del primer mundo"), pero el impacto social fue devastador: desindustrialización definitiva, cierre de fábricas, y un crecimiento exponencial e inédito de la desocupación y la pobreza estructural.</p>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                                <h3 class="text-xl font-bold text-slate-800 mb-3"><i class="fas fa-fire text-orange-500 mr-2"></i>Klachko: De la espontaneidad a la organización (1993-2001)</h3>
                                <p class="text-sm text-slate-600 mb-4">Klachko periodiza cómo la resistencia popular evolucionó durante la década menemista. La clase obrera, duramente golpeada y traicionada por la burocracia sindical, debió inventar nuevas formas de lucha y organización.</p>
                                
                                <h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Hitos del ciclo de rebelión:</h4>
                                <div class="space-y-4 mb-6">
                                    <div class="bg-slate-50 p-4 rounded border border-slate-200">
                                        <h5 class="font-bold text-red-700 mb-1">1. El Santiagazo (Diciembre 1993)</h5>
                                        <p class="text-sm text-slate-700">El punto de partida. Una explosión de furia de empleados públicos en Santiago del Estero a los que se les adeudaban meses de sueldo. Tomó la forma de <strong>motín espontáneo y violento</strong>. Quemaron la Casa de Gobierno, los tribunales y las mansiones de los políticos corruptos. Fue una catarsis masiva, pero careció de organización permanente; al terminar la furia, se disolvió.</p>
                                    </div>
                                    <div class="bg-slate-50 p-4 rounded border border-slate-200">
                                        <h5 class="font-bold text-red-700 mb-1">2. Cutral Có y Plaza Huincul (1996/1997)</h5>
                                        <p class="text-sm text-slate-700">El salto cualitativo histórico. Pueblos petroleros de Neuquén devastados por la privatización y despidos masivos de YPF. Como los obreros estaban desocupados, la huelga en la fábrica ya no servía. Inventaron el <strong>Piquete (corte de ruta total)</strong>, frenando la circulación de mercancías e insumos del capital. Emergen la figura del <em>piquetero/fogonero</em> y una nueva forma de democracia directa: la <strong>Asamblea Popular</strong>, superando a los sindicatos y partidos tradicionales.</p>
                                    </div>
                                    <div class="bg-slate-50 p-4 rounded border border-slate-200">
                                        <h5 class="font-bold text-red-700 mb-1">3. Corrientes (1999)</h5>
                                        <p class="text-sm text-slate-700">Sostenimiento y masividad. Docentes y estatales bloquearon el Puente Gral. Belgrano durante meses. Aquí se consolida la figura del <strong>"Autoconvocado"</strong> (el trabajador de base que desborda y repudia a su propio sindicato burocrático por inacción). Lograron la destitución del gobernador "Tato" Romero Feris, marcando victorias políticas reales pese a la letal represión de Gendarmería.</p>
                                    </div>
                                    <div class="bg-slate-50 p-4 rounded border border-slate-200">
                                        <h5 class="font-bold text-red-700 mb-1">4. El Estallido Final (19 y 20 de Diciembre de 2001)</h5>
                                        <p class="text-sm text-slate-700">La culminación del ciclo. Una <em>insurrección popular espontánea</em> a escala nacional. Tras el "corralito" (robo de los ahorros) de Domingo Cavallo, colapsó el modelo. En las calles confluyeron tácticamente dos sectores: los pobres/desocupados (saqueos por hambre) y las clases medias urbanas pauperizadas (cacerolazos contra los bancos y el estado de sitio). Renuncia De la Rúa con el grito hegemónico de "Que se vayan todos".</p>
                                    </div>
                                </div>

                                <h4 class="font-bold text-slate-700 mb-2 border-b pb-1">La discusión teórica sobre la Clase Obrera:</h4>
                                <ul class="list-disc pl-5 space-y-3 text-slate-700 text-sm">
                                    <li>En los 90, la sociología dominante (e incluso intelectuales progresistas) decretaron "el fin del trabajo" o la "desaparición de la clase obrera", argumentando que los sujetos de las protestas eran "nuevos movimientos sociales" amorfos (vecinos, excluidos, marginados).</li>
                                    <li>Klachko discute esta visión. Su tesis fundamental es que <strong>el movimiento piquetero y los desocupados SON clase obrera</strong>. Constituyen la fracción más pauperizada, lo que Marx llamaba el "ejército industrial de reserva". Por lo tanto, el ciclo de rebeliones de los años 90 no fue la muerte de la clase obrera, sino que fue protagonizado enteramente por ella, buscando nuevas formas de organización (piquete, asamblea) ante la traición de sus antiguas estructuras sindicales.</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                                <h3 class="font-bold text-lg text-slate-800 mb-3">12. En el marco del modelo neoliberal de los '90, ¿cuál es el debate teórico que Paula Klachko establece contra la idea del "fin de la clase obrera" en Argentina?</h3>

                                        <li>Ante los despidos masivos por las privatizaciones y la desindustrialización menemista, intelectuales y sociólogos sostenían que la clase obrera había desaparecido o perdido su potencial histórico, y que las protestas eran llevadas a cabo por "nuevos movimientos sociales" de excluidos marginales, sin anclaje de clase.</li>
                                        <li><strong>Refutación de Klachko:</strong> Demuestra teórica y empíricamente que <strong>los desocupados (piqueteros) SON parte íntegra de la clase obrera</strong>. Conforman su fracción más pauperizada, el "ejército industrial de reserva". Por lo tanto, el ciclo de rebeliones (1993-2001) no demostró la desaparición del movimiento obrero, sino que fue liderado por la propia clase obrera (ocupada y desocupada), que debió inventar nuevas formas de lucha y organización (el piquete y la asamblea) al quedarse sin fábricas para parar.</li>
                                    </ul>
                                </div>
                            </div>

                        </div>
                    </div>
                `
            }
        };

        const navContainer = document.getElementById('sidebar-nav');
        const mainContent = document.getElementById('main-content');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.querySelector('aside');
        const mobileOverlay = document.getElementById('mobile-overlay');

        // Function to render navigation
        function renderNav() {
            navContainer.innerHTML = '';
            for (const key in studyData) {
                const item = studyData[key];
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-3 border-l-4 border-transparent focus:outline-none';
                btn.innerHTML = `<i class="${item.icon} w-5 text-center"></i> <span class="text-sm font-medium">${item.title}</span>`;
                btn.onclick = () => loadContent(key, btn);
                navContainer.appendChild(btn);
            }
        }

        // Function to load content
        function loadContent(key, activeBtn = null) {
            // Update active state in nav
            const allBtns = navContainer.querySelectorAll('button');
            allBtns.forEach(b => {
                b.classList.remove('border-blue-500', 'bg-slate-800', 'text-white');
                b.classList.add('border-transparent');
            });
            
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent');
                activeBtn.classList.add('border-blue-500', 'bg-slate-800', 'text-white');
            } else {
                // Default to first button
                allBtns[0].classList.remove('border-transparent');
                allBtns[0].classList.add('border-blue-500', 'bg-slate-800', 'text-white');
            }

            // Inject content
            mainContent.innerHTML = studyData[key].content;
            mainContent.scrollTop = 0;

            // Close mobile menu if open
            if (window.innerWidth < 768) {
                toggleMobileMenu(false);
            }
        }

        // Function to toggle answers in the mock exam
        window.toggleAnswer = function(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            } else {
                el.classList.add('hidden');
            }
        }

        // Mobile menu logic
        function toggleMobileMenu(show) {
            if (show) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('absolute', 'z-30');
                mobileOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('absolute', 'z-30');
                mobileOverlay.classList.add('hidden');
            }
        }

        mobileMenuBtn.addEventListener('click', () => toggleMobileMenu(true));
        mobileOverlay.addEventListener('click', () => toggleMobileMenu(false));

        // Initialize
        renderNav();
        loadContent('intro');

    </script>
</body>
